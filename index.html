<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie and Series</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header -->
    <div class="header">
      <h1 class="logo">MOVIE & SERIES</h1>

      <div>
        <div class="input-container">
          <input id="title" type="search" placeholder="Enter title..." />
          <select id="type">
            <option value="movie">Movie</option>
            <option value="tv">Series</option>
          </select>
        </div>
        <button class="search-btn">
          <span class="material-symbols-outlined"> search </span>
        </button>
      </div>
    </div>

    <div class="no-result">
      No results are found base on your search "<span></span>".
    </div>

    <div style="padding: 30px" class="main">
      <!-- thumbnail -->
      <div class="flex-container"></div>

      <!-- pagination -->
      <nav style="cursor: pointer" aria-label="Page navigation example">
        <ul class="pagination"></ul>
      </nav>

      <!-- details -->
      <div
        style="justify-self: center; align-self: center; transition: all 0.2s"
        class="film-detail-container"
        id="detail-container"
      ></div>
    </div>

    <script src="script.js"></script>
    <script src="thumbnail.js"></script>
    <script src="pagination.js"></script>
    <script src="deatil.js"></script>
  </body>
</html>
